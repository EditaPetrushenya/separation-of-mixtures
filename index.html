.guide{display:flex;align-items:flex-end;gap:8px;min-width:0;flex:1;justify-content:flex-end}
.bubble{position:relative;background:#fff;color:#26204d;border-radius:18px 18px 4px 18px;padding:12px 14px;margin-bottom:56px;
  max-width:320px;font-weight:700;font-size:.95rem;box-shadow:0 6px 20px rgba(20,16,46,.35)}
.louis{width:clamp(96px,22vw,150px);height:auto;display:block;transform-origin:50% 100%;animation:bob 3s ease-in-out infinite;flex:none}
.louis.cheer{animation:cheer .6s ease 3}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes cheer{40%{transform:translateY(-18px) rotate(4deg)}}

.pips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pip{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:0;font-weight:800;font-size:.85rem;color:var(--muted)}
.pip b{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--fg);font-family:var(--display)}
.pip span{overflow-wrap:anywhere}
.pip.on{border-color:var(--louis);color:var(--fg)}
.pip.on b{background:var(--louis);color:#fff}
.pip.done{border-color:var(--ok);color:var(--fg)}
.pip.done b{background:var(--ok);color:#fff}

.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.bubble{margin-bottom:40px}}
@media (max-width:520px){.banner{flex-direction:column;align-items:stretch}.guide{justify-content:flex-start}.bubble{margin-bottom:24px;border-radius:18px 18px 18px 4px}.pip{font-size:.75rem;padding:6px}}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;min-width:0}
.scene svg{width:100%;height:auto;display:block;border-radius:14px;background:linear-gradient(180deg,var(--louis-soft),var(--card))}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-weight:800;font-size:.85rem}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:2px solid var(--fg)}

.panel{display:flex;flex-direction:column;gap:14px}
.step-tag{font:700 .8rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--louis)}
.panel h2{font-size:1.5rem}
.panel p{margin:0}
.quiz{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--louis-soft);border:2px solid transparent;color:var(--fg);border-radius:14px;padding:10px 14px;font-weight:800}
.opt:hover:not(:disabled){border-color:var(--louis)}
.opt.right{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.actions{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.act{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--louis);color:#fff;border:0;border-radius:14px;padding:11px 14px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.act:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.act:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
.act.done{background:var(--ok);color:#fff;opacity:.85}
.act .n{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.28);font-family:var(--display)}
.note{background:var(--louis-soft);border-radius:14px;padding:10px 14px;font-weight:700;font-size:.9rem}
.note.warn{background:#fff1d1;color:#5a3d00}
.next{align-self:flex-start;background:var(--gold);color:#3a2700;border:0;border-radius:14px;padding:12px 20px;font:700 1.05rem var(--display);box-shadow:0 4px 0 rgba(0,0,0,.2)}

.finale{display:flex;flex-direction:column;gap:16px}
.jars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center;font-weight:800}
.jar{border:3px solid var(--fg);border-top-width:6px;border-radius:6px 6px 22px 22px;height:90px;display:flex;align-items:flex-end;overflow:hidden;background:var(--glass)}
.jar i{display:block;width:100%;height:55%;animation:fill 1s ease both}
@keyframes fill{from{height:0}}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.recap div{background:var(--louis-soft);border-radius:14px;padding:12px}
.recap b{font-family:var(--display);display:block;color:var(--louis)}

/* scene pieces */
.dot{transition:transform 1.6s cubic-bezier(.4,.1,.3,1),opacity 1.2s}
.dot.fast{transition-duration:.28s}
.wtr{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.4s ease,opacity 1s}
.pour{transition:transform 1.1s ease;transform-origin:200px 60px}
.flame{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s ease;transform:scaleY(0)}
.flame.on{transform:scaleY(1);animation:flick .3s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(.88) scaleX(1.06)}}
.steam circle{opacity:0}
.steam.on circle{animation:rise 2s ease-in infinite}
.steam.on circle:nth-child(2){animation-delay:.6s}.steam.on circle:nth-child(3){animation-delay:1.2s}
@keyframes rise{0%{opacity:0;transform:translateY(0)}30%{opacity:.8}100%{opacity:0;transform:translateY(-60px)}}
.sun{opacity:0;transition:opacity 1s}.sun.on{opacity:1}
.drip circle{opacity:0}
.drip.on circle{animation:fall .6s ease-in infinite}
@keyframes fall{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){.louis,.flame.on,.steam.on circle{animation:none}.dot,.wtr,.pour{transition-duration:.01s}}
</style>

      <div id="stage"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function place(e, x, y) { e.style.transform = `translate(${x}px,${y}px) rotate(${e._r || 0}deg)`; }
function mkDot(parent, type, x, y) {
  let e;
  if (type === 'saw') {
    e = el('rect', { x: -5, y: -2, width: 10, height: 4, rx: 1.5 }, parent);
    e.style.fill = 'var(--saw)';
  } else {
    e = el('circle', { r: type === 'sand' ? 3.2 : 2.6 }, parent);
    e.style.fill = type === 'sand' ? 'var(--sand)' : 'var(--lime)';
    if (type === 'lime') { e.style.stroke = 'var(--line)'; e.style.strokeWidth = '.8'; }
  }
  e.classList.add('dot');
  e._r = rnd(-60, 60);
  place(e, x, y);
  return e;
}

const STEPS = [
  {
    name: 'Отстаивание', title: 'Вода все сортирует',
    q: 'Опилки легче воды, а песок тяжелее. Как этим воспользоваться?',
    opts: [['Налить воду и подождать (отстаивание)', 1], ['Нагреть на огне', 0], ['Сразу насыпать в фильтр', 0]],
    hint: 'Подумай: в какой жидкости легкое всплывает, а тяжелое тонет?',
    ok: 'Точно! Это называется отстаивание.',
    learn: 'Опилки легче воды и всплывут. Песок тяжелый и осядет на дно. Известь немного растворится, и вода станет мутной.'
  },
  {
    name: 'Фильтрование', title: 'Ловим песок в фильтр',
    q: 'В мутной воде плавают крупинки песка. Песок не растворяется, а известь растворилась. Как убрать песок?',
    opts: [['Пропустить воду через фильтр (фильтрование)', 1], ['Выпарить воду', 0], ['Добавить еще воды', 0]],
    hint: 'Нужна «сеточка», которая пропустит воду, но задержит крупинки.',
    ok: 'Верно! Это фильтрование.',
    learn: 'Бумажный фильтр задерживает песок. Вода с растворенной известью проходит сквозь него и становится прозрачной.'
  },
  {
    name: 'Выпаривание', title: 'Достаем известь из воды',
    q: 'В прозрачной воде растворена известь. Ее не видно, но она там. Как ее достать?',
    opts: [['Выпарить воду (выпаривание)', 1], ['Еще раз профильтровать', 0], ['Подождать, пока осядет', 0]],
    hint: 'Растворенное вещество проходит через фильтр и не оседает. А вот вода умеет улетать паром!',
    ok: 'Да! Это выпаривание.',
    learn: 'Вода нагревается и улетает паром. Известь не испаряется, поэтому остается на дне чашки белым порошком.',
    warn: 'С огнем работаем только вместе со взрослым!'
  }
];

const state = { step: 0, solved: false, act: 0, busy: false, ctx: null };
const GAME_HTML = $('#game').innerHTML;

function say(t) { $('#say').textContent = t; }
function cheer() {
  const l = $('#louis');
  l.classList.remove('cheer'); void l.offsetWidth; l.classList.add('cheer');
}

function renderPips() {
  $('#pips').innerHTML = STEPS.map((s, i) =>
    `<div class="pip ${i < state.step ? 'done' : i === state.step ? 'on' : ''}"><b>${i < state.step ? '✓' : i + 1}</b><span>${s.name}</span></div>`
  ).join('');
}

function renderPanel(focus) {
  const s = STEPS[state.step], sc = SCENES[state.step];
  let h = `<div class="step-tag">Шаг ${state.step + 1} из 3 · ${s.name}</div><h2>${s.title}</h2>`;
  if (s.warn) h += `<div class="note warn">🔥 ${s.warn}</div>`;
  if (!state.solved) {
    h += `<p>${s.q}</p><div class="quiz">` +
      s.opts.map((o, i) => `<button class="opt" data-i="${i}">${o[0]}</button>`).join('') + `</div>`;
  } else {
    h += `<div class="note">💡 ${s.learn}</div><ol class="actions">` +
      sc.actions.map((a, i) => {
        const done = i < state.act, on = i === state.act && !state.busy;
        return `<li><button class="act ${done ? 'done' : ''}" data-a="${i}" ${on ? '' : 'disabled'}><span class="n">${done ? '✓' : i + 1}</span>${a.label}</button></li>`;
      }).join('') + `</ol>`;
    if (state.act >= sc.actions.length) {
      h += `<button class="next" id="next">${state.step < 2 ? 'К шагу ' + (state.step + 2) + ' →' : 'Готово!'}</button>`;
    }
  }
  $('#panel').innerHTML = h;
  if (focus) ($('#panel .act:not(:disabled)') || $('#next'))?.focus();
}

function startStep() {
  state.solved = false; state.act = 0; state.busy = false;
  state.ctx = SCENES[state.step].build($('#stage'));
  renderPips(); renderPanel(false);
  say(state.step === 0
    ? 'Привет! Я Луи. Мой огород засыпало смесью из опилок, песка и извести. Поможешь ее разделить?'
    : state.step === 1
      ? 'Опилки уже в лотке. Теперь надо убрать песок из мутной воды.'
      : 'Песок спасен! Осталось достать известь, которая спряталась в воде.');
}

$('#game').addEventListener('click', async e => {
  const opt = e.target.closest('.opt');
  if (opt) {
    const s = STEPS[state.step];
    if (s.opts[+opt.dataset.i][1]) {
      opt.classList.add('right');
      say(s.ok); cheer();
      await sleep(700);
      state.solved = true; renderPanel(true);
    } else {
      opt.classList.remove('wrong'); void opt.offsetWidth; opt.classList.add('wrong');
      say('Хм, не совсем. ' + s.hint);
    }
    return;
  }
  const act = e.target.closest('.act');
  if (act && !act.disabled) {
    const a = SCENES[state.step].actions[+act.dataset.a];
    state.busy = true; renderPanel(false);
    await a.run(state.ctx);
    state.busy = false; state.act++;
    say(a.say); renderPanel(true);
    return;
  }
  if (e.target.closest('#next')) {
    cheer();
    if (state.step < 2) { state.step++; startStep(); } else finale();
  }
});

function finale() {
  renderPips();
  document.querySelectorAll('.pip').forEach(p => p.className = 'pip done');
  $('#pips').querySelectorAll('b').forEach(b => b.textContent = '✓');
  say('Ура! Огород спасен: опилки, песок и известь лежат каждый в своей баночке!');
  cheer();
  $('#game').innerHTML = `<section class="card finale" style="grid-column:1/-1">
    <h2>Смесь разделена!</h2>
    <div class="jars">
      <div><div class="jar"><i style="background:var(--saw)"></i></div>Опилки</div>
      <div><div class="jar"><i style="background:var(--sand)"></i></div>Песок</div>
      <div><div class="jar"><i style="background:var(--lime);border-top:2px solid var(--line)"></i></div>Известь</div>
    </div>
    <div class="recap">
      <div><b>Отстаивание</b>Легкое всплывает, тяжелое тонет.</div>
      <div><b>Фильтрование</b>Нерастворимое остается на фильтре.</div>
      <div><b>Выпаривание</b>Вода улетает, растворенное остается.</div>
    </div>
    <button class="next" id="again">Играть снова</button></section>`;
  $('#again').addEventListener('click', () => {
    $('#game').innerHTML = GAME_HTML;
    state.step = 0; startStep();
  });
}

const SCENES = [];
const OUT = 'fill:none;stroke:var(--fg);stroke-width:4;stroke-linecap:round;stroke-linejoin:round';

/* ---------- Шаг 1: отстаивание ---------- */
SCENES[0] = {
  build(stage) {
    stage.innerHTML = `<svg viewBox="0 0 420 320" role="img" aria-label="Стакан со смесью, второй стакан и лоток для опилок">
      <defs>
        <clipPath id="c1"><path d="M46 92H194V262Q194 276 180 276H60Q46 276 46 262Z"/></clipPath>
        <clipPath id="c2"><path d="M266 152H374V262Q374 276 360 276H280Q266 276 266 262Z"/></clipPath>
      </defs>
      <rect x="0" y="282" width="420" height="38" style="fill:var(--line)"/>
      <path d="M268 100Q320 122 372 100Z" style="fill:var(--glass);stroke:var(--fg);stroke-width:3"/>
      <g clip-path="url(#c2)">
        <rect class="wtr" id="w2" x="266" y="152" width="108" height="124" style="fill:var(--water);transform:scaleY(0)"/>
        <rect class="wtr" id="m2" x="266" y="152" width="108" height="124" style="fill:#fff;opacity:0"/>
      </g>
      <g id="d2"></g>
      <path d="M260 120V262Q260 282 280 282H360Q380 282 380 262V120" style="${OUT}"/>
      <path id="stream" d="M204 66Q250 66 290 150" style="fill:none;stroke:var(--water);stroke-width:5;stroke-linecap:round;opacity:0;transition:opacity .4s"/>
      <g id="g1" class="pour">
        <g clip-path="url(#c1)">
          <rect class="wtr" id="w1" x="46" y="92" width="148" height="184" style="fill:var(--water);transform:scaleY(0)"/>
          <rect class="wtr" id="m1" x="46" y="92" width="148" height="184" style="fill:#fff;opacity:0"/>
        </g>
        <g id="d1"></g>
        <path d="M40 60V262Q40 282 60 282H180Q200 282 200 262V60" style="${OUT}"/>
      </g>
    </svg>`;
    const q = s => stage.querySelector(s), d1 = q('#d1'), d2 = q('#d2');
    const c = { g1: q('#g1'), w1: q('#w1'), m1: q('#m1'), w2: q('#w2'), m2: q('#m2'), stream: q('#stream'), sand: [], lime: [], saw: [], d2sand: [] };
    for (let i = 0; i < 40; i++) c.sand.push(mkDot(d1, 'sand', rnd(52, 188), rnd(262, 273)));
    for (let i = 0; i < 30; i++) c.lime.push(mkDot(d1, 'lime', rnd(52, 188), rnd(254, 272)));
    for (let i = 0; i < 26; i++) c.saw.push(mkDot(d1, 'saw', rnd(52, 188), rnd(250, 270)));
    for (let i = 0; i < 6; i++) { const d = mkDot(d2, 'sand', rnd(278, 362), rnd(205, 268)); d.style.opacity = 0; c.d2sand.push(d); }
    c.all = [...c.sand, ...c.lime, ...c.saw];
    return c;
  },
  actions: [
    { label: 'Налить воду', say: 'Вода в стакане! Смесь пока лежит на дне.',
      async run(c) { c.w1.style.transform = 'scaleY(1)'; await sleep(1500); } },
    { label: 'Хорошо размешать', say: 'Кручу-верчу! Все перемешалось.',
      async run(c) {
        c.all.forEach(d => d.classList.add('fast'));
        for (let i = 0; i < 10; i++) {
          c.all.forEach(d => { d._r = rnd(-90, 90); place(d, rnd(54, 186), rnd(100, 268)); });
          await sleep(300);
        }
        c.all.forEach(d => d.classList.remove('fast'));
      } },
    { label: 'Подождать, пока отстоится', say: 'Смотри: опилки всплыли, песок на дне, а вода стала мутной от извести.',
      async run(c) {
        c.saw.forEach(d => { d.style.transitionDuration = rnd(1.5, 2.6) + 's'; place(d, rnd(56, 184), rnd(96, 106)); });
        c.sand.forEach(d => { d.style.transitionDuration = rnd(1.8, 3) + 's'; place(d, rnd(52, 188), rnd(262, 273)); });
        c.lime.forEach(d => { d.style.transitionDuration = '2s'; d.style.opacity = 0; });
        c.m1.style.opacity = .45;
        await sleep(3200);
      } },
    { label: 'Снять опилки ложкой', say: 'Опилки в лотке! Их потом высушим.',
      async run(c) {
        for (const d of c.saw) { d.style.transitionDuration = '.9s'; place(d, rnd(290, 350), rnd(97, 105)); await sleep(60); }
        await sleep(1000);
      } },
    { label: 'Слить мутную воду в другой стакан', say: 'Песок остался на дне, а мутная вода переехала во второй стакан.',
      async run(c) {
        c.g1.style.transform = 'rotate(20deg)'; await sleep(1100);
        c.stream.style.opacity = .9;
        c.w1.style.transform = 'scaleY(.1)'; c.w2.style.transform = 'scaleY(.7)'; c.m2.style.opacity = .45;
        c.d2sand.forEach(d => { d.style.opacity = .9; });
        await sleep(1600);
        c.stream.style.opacity = 0; c.g1.style.transform = 'rotate(0deg)'; c.m1.style.opacity = 0;
        await sleep(1200);
      } }
  ]
};

/* ---------- Шаг 2: фильтрование ---------- */
SCENES[1] = {
  build(stage) {
    stage.innerHTML = `<svg viewBox="0 0 420 320" role="img" aria-label="Воронка с бумажным фильтром над стаканом">
      <defs>
        <clipPath id="c3"><path d="M126 68H294L217 156H203Z"/></clipPath>
        <clipPath id="c4"><path d="M156 206H264V262Q264 276 250 276H170Q156 276 156 262Z"/></clipPath>
      </defs>
      <rect x="0" y="282" width="420" height="38" style="fill:var(--line)"/>
      <g clip-path="url(#c4)"><rect class="wtr" id="w4" x="156" y="206" width="108" height="70" style="fill:var(--water);transform:scaleY(0)"/></g>
      <path d="M150 200V262Q150 282 170 282H250Q270 282 270 262V200" style="${OUT}"/>
      <path d="M124 66H296L218 158H202Z" style="fill:var(--louis-soft);stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4"/>
      <g clip-path="url(#c3)">
        <rect class="wtr" id="w3" x="124" y="68" width="172" height="90" style="fill:var(--water);transform:scaleY(0)"/>
        <rect class="wtr" id="m3" x="124" y="68" width="172" height="90" style="fill:#fff;opacity:.4;transform:scaleY(0)"/>
      </g>
      <g id="d3"></g>
      <path d="M110 60H310L226 160V215H194V160Z" style="${OUT}"/>
      <g class="drip" id="drip"><circle cx="210" cy="220" r="3" style="fill:var(--water)"/><circle cx="210" cy="220" r="3" style="fill:var(--water);animation-delay:.3s"/></g>
      <path d="M316 266Q358 296 400 266Z" style="fill:var(--glass);stroke:var(--fg);stroke-width:3"/>
      <g id="d4"></g>
      <g class="sun" id="sun" transform="translate(358 214)">
        <circle r="13" style="fill:var(--gold)"/>
        <g style="stroke:var(--gold);stroke-width:3;stroke-linecap:round">
          <path d="M0-20V-27M0 20V27M-20 0H-27M20 0H27M14-14l5-5M-14-14l-5-5M14 14l5 5M-14 14l-5 5"/>
        </g>
      </g>
    </svg>`;
    const q = s => stage.querySelector(s), d3 = q('#d3');
    const c = { w3: q('#w3'), m3: q('#m3'), w4: q('#w4'), drip: q('#drip'), sun: q('#sun'), d4: q('#d4'), sand: [] };
    for (let i = 0; i < 14; i++) {
      const d = mkDot(d3, 'sand', rnd(150, 270), rnd(80, 115)); d.style.opacity = 0; c.sand.push(d);
    }
    return c;
  },
  actions: [
    { label: 'Налить мутную воду в воронку с фильтром', say: 'Песчинки падают на фильтр и остаются на нем.',
      async run(c) {
        c.w3.style.transform = 'scaleY(1)'; c.m3.style.transform = 'scaleY(1)';
        c.sand.forEach(d => { d.style.opacity = 1; });
        await sleep(900);
        c.sand.forEach(d => {
          const y = rnd(140, 154), hw = 9 + (154 - y) - 3;
          d.style.transitionDuration = rnd(1.2, 2) + 's';
          place(d, 210 + rnd(-1, 1) * hw, y);
        });
        await sleep(2200);
      } },
    { label: 'Подождать, пока вода стечет', say: 'Вода стала прозрачной! В ней спряталась растворенная известь.',
      async run(c) {
        c.drip.classList.add('on');
        c.w3.style.transitionDuration = '2.8s'; c.m3.style.transitionDuration = '2.8s';
        c.w3.style.transform = 'scaleY(.04)'; c.m3.style.transform = 'scaleY(.04)';
        c.w4.style.transitionDuration = '3s'; c.w4.style.transform = 'scaleY(.6)';
        await sleep(3200);
        c.drip.classList.remove('on');
      } },
    { label: 'Промыть и высушить песок', say: 'Песок чистый и сухой. Откладываем его в баночку!',
      async run(c) {
        c.sun.classList.add('on');
        for (const d of c.sand) {
          d.style.transitionDuration = '1.2s'; place(d, rnd(332, 384), rnd(262, 270)); await sleep(70);
        }
        await sleep(1500);
      } }
  ]
};

/* ---------- Шаг 3: выпаривание ---------- */
SCENES[2] = {
  build(stage) {
    stage.innerHTML = `<svg viewBox="0 0 420 320" role="img" aria-label="Фарфоровая чашка на штативе над горелкой">
      <defs><clipPath id="c5"><path d="M146 150H274Q270 176 210 178Q150 176 146 150Z"/></clipPath></defs>
      <rect x="0" y="282" width="420" height="38" style="fill:var(--line)"/>
      <path d="M140 282L158 182M280 282L262 182M150 182H270" style="${OUT}"/>

      <rect x="204" y="232" width="12" height="12" style="fill:var(--fg)"/>
      <g class="flame" id="flame">
        <path d="M210 232C194 214 200 200 210 188C220 200 226 214 210 232Z" style="fill:var(--gold)"/>

      </g>
      <path d="M142 150H278Q274 178 210 180Q146 178 142 150Z" style="fill:var(--glass)"/>

      <path d="M142 150H278Q274 178 210 180Q146 178 142 150Z" style="${OUT}"/>
      <g class="steam" id="steam">
        <circle cx="190" cy="138" r="7" style="fill:var(--muted)"/>

        <circle cx="236" cy="138" r="7" style="fill:var(--muted)"/>
      </g>
    </svg>`;
    const q = s => stage.querySelector(s), d5 = q('#d5');
    const c = { w5: q('#w5'), flame: q('#flame'), steam: q('#steam'), powder: [] };
    for (let i = 0; i < 18; i++) {
      const d = mkDot(d5, 'lime', rnd(178, 242), rnd(167, 174)); d.style.opacity = 0; d.style.strokeWidth = '1.2'; c.powder.push(d);
    }
    return c;
  },
  actions: [
    { label: 'Налить прозрачный фильтрат в фарфоровую чашку', say: 'В чашке вода, а в ней растворена известь.',
      async run(c) { c.w5.style.transform = 'scaleY(1)'; await sleep(1400); } },
    { label: 'Зажечь горелку (вместе со взрослым)', say: 'Огонек горит. Чашка нагревается.',
      async run(c) { c.flame.classList.add('on'); await sleep(900); } },
    { label: 'Выпаривать воду', say: 'Вода улетает паром, а на дне остался белый порошок!',
      async run(c) {
        c.steam.classList.add('on');
        c.w5.style.transition = 'transform 4.5s linear';
        c.w5.style.transform = 'scaleY(.03)';
        await sleep(2000);
        c.powder.forEach(d => { d.style.transitionDuration = '2.5s'; d.style.opacity = 1; });
        await sleep(2700);
      } },
    { label: 'Погасить огонь', say: 'Готово! Это сухая известь.',
      async run(c) { c.flame.classList.remove('on'); c.steam.classList.remove('on'); await sleep(700); } }
  ]
};

startStep();

</script>
